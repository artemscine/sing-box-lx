name: build-openwrt-apk

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target architecture"
        type: choice
        options: [all, x86_64, aarch64_cortex-a53]
        default: all
      apply_slim:
        description: "Apply Podkop profile (slim plus isolated router fixes)"
        type: boolean
        default: true
      release:
        description: "Publish to GitHub Release"
        type: boolean
        default: true
      tag_name:
        description: "Release tag name (leave blank to derive from upstream.version and OpenWrt revisions)"
        default: ""

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          if [ "$TARGET" = "x86_64" ]; then
            echo 'matrix={"include":[{"architecture":"x86_64","goarch":"amd64"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "aarch64_cortex-a53" ]; then
            echo 'matrix={"include":[{"architecture":"aarch64_cortex-a53","goarch":"arm64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"architecture":"x86_64","goarch":"amd64"},{"architecture":"aarch64_cortex-a53","goarch":"arm64"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    name: build ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve toolchain and version
        id: vars
        run: |
          GO_PIN="$(tr -d '[:space:]' < go.version | sed 's/^go//')"
          echo "go_version=${GO_PIN}" >> "$GITHUB_OUTPUT"

          source openwrt.version
          OPENWRT_VER="$(tr -d '[:space:]' < upstream.version)-lx.${LX_REVISION}-openwrt.${OPENWRT_REVISION}"
          BUILD_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$BUILD_TAG" ]; then
            BUILD_TAG="v${OPENWRT_VER}"
          fi
          echo "tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${BUILD_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.vars.outputs.go_version }}

      - name: Install apk-tools
        run: |
          docker run --rm -v /usr/local/bin:/mnt alpine:edge sh -c "apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk"
          apk --version

      - name: Test Podkop patches
        if: ${{ inputs.apply_slim }}
        run: bash scripts/test-openwrt.sh

      - name: Build and package OpenWrt APK and IPK
        env:
          OPENWRT_BUILD_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          SLIM=0
          if [ "${{ inputs.apply_slim }}" = "true" ]; then SLIM=1; fi
          bash scripts/build-openwrt.sh "${{ matrix.architecture }}" dist "$SLIM"
          cd dist
          sha256sum *.apk *.ipk > SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box_${{ steps.vars.outputs.version }}_openwrt_${{ matrix.architecture }}
          path: |
            dist/*.apk
            dist/*.ipk
            dist/SHA256SUMS
            dist/build-*.txt

  release:
    needs: [matrix, build]
    name: Publish Release
    runs-on: ubuntu-latest
    if: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: vars
        run: |
          source openwrt.version
          OPENWRT_VER="$(tr -d '[:space:]' < upstream.version)-lx.${LX_REVISION}-openwrt.${OPENWRT_REVISION}"
          BUILD_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$BUILD_TAG" ]; then
            BUILD_TAG="v${OPENWRT_VER}"
          fi
          echo "tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${BUILD_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
      - name: Prepare release files
        run: |
          mkdir -p release-files
          find all-dist -type f \( -name '*.apk' -o -name '*.ipk' -o -name 'build-*.txt' \) -exec cp {} release-files/ \;
          cd release-files
          sha256sum *.apk *.ipk > SHA256SUMS
          ls -lh
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cat > notes.md << 'EOF'
          ### sing-box-lx for OpenWrt 24.10 (IPK) / 25.12 (APK) (x86_64, aarch64_cortex-a53)
          - **Features:** `with_quic,with_utls,with_clash_api,with_xhttp`
          - **Podkop profile:** ${{ inputs.apply_slim }} (slim plus DNS, UDP, TLS, loop and logging fixes)
          - **Source and patch hashes:** included in architecture-specific build manifests
          - **Uncompressed:** optimized for direct flash/squashfs execution without RAM blowup
          EOF
          gh release create "$TAG" release-files/* \
            --title "sing-box-lx ${{ steps.vars.outputs.version }} for OpenWrt" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
